<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="China OS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>China Travel OS</title>
<style>
/* ═══════════════════════════════════════════════════════════
   ВАЖНО: только системные шрифты.
   fonts.googleapis.com заблокирован в материковом Китае —
   любая внешняя загрузка шрифта повесит приложение.
   ═══════════════════════════════════════════════════════════ */
:root{
  --paper:#FBFAF7;
  --card:#FFFFFF;
  --ink:#14171A;
  --graphite:#6C7176;
  --mute:#9BA0A4;
  --hairline:#E5E3DD;
  --wash:#F1EFE9;
  --signal:#E3A70B;
  --signal-ink:#4A3600;
  --seal:#A8342A;
  --seal-wash:#FBF3F2;

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --cjk:"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",var(--sans);

  --nav:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--seal);outline-offset:3px;border-radius:4px}

.wrap{max-width:460px;margin:0 auto;padding:0 18px calc(var(--nav) + var(--safe-b) + 28px)}
.cjk{font-family:var(--cjk)}

.eyebrow{
  font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mute);
}

/* ── шапка экрана ─────────────────────────────── */
.head{padding:26px 0 18px;border-bottom:1px solid var(--hairline);margin-bottom:4px}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.h1{font-size:28px;font-weight:600;letter-spacing:-.022em;line-height:1.14;margin-top:11px}
.lede{margin-top:9px;font-size:14.5px;color:var(--graphite);line-height:1.5}

/* ── карточка «показать» ──────────────────────── */
.show{
  background:var(--card);border:1px solid var(--hairline);border-radius:3px;
  padding:18px 18px 16px;margin:18px 0;
  box-shadow:0 1px 2px rgba(20,23,26,.04);
}
.show .eyebrow{display:block;margin-bottom:11px}
.cjk-lg{font-family:var(--cjk);font-size:27px;font-weight:600;line-height:1.3;letter-spacing:.01em}
.cjk-md{font-family:var(--cjk);font-size:15px;line-height:1.55;color:var(--graphite);margin-top:5px}
.rule{height:2px;width:32px;background:var(--seal);margin:14px 0 11px}
.latin{font-size:14.5px;font-weight:550;line-height:1.35}
.tel{font-family:var(--mono);font-size:13px;color:var(--graphite);margin-top:4px;display:block}
.tel a{color:var(--seal);text-decoration:none}

/* ── шаги ─────────────────────────────────────── */
.sect-t{
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.15em;
  text-transform:uppercase;color:var(--mute);margin:26px 0 2px;
}
.step{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:17px 0;border-top:1px solid var(--hairline)}
.num{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--mute);padding-top:3px;letter-spacing:.03em}
.step-h{font-size:16.5px;font-weight:550;letter-spacing:-.008em;line-height:1.32}
.step-h .cjk{font-weight:600}
.step-b{margin-top:5px;font-size:14.5px;color:var(--graphite);line-height:1.5}
.step-b .cjk, .step-h .cjk, .plate-n .cjk, .dir small .cjk, .act .cjk, .tip .cjk, .warn .cjk{
  display:inline-block;background:var(--wash);border:1px solid var(--hairline);
  border-radius:3px;padding:0 5px;font-weight:600;color:var(--ink);
  line-height:1.5;white-space:nowrap;
}
.step-b b{color:var(--ink);font-weight:600}

.data{display:flex;gap:13px;margin-top:9px;flex-wrap:wrap}
.data span{font-family:var(--mono);font-size:12px;color:var(--graphite);letter-spacing:.02em;white-space:nowrap}

/* линия метро — цвет тут это ДАННЫЕ */
.roundel{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.ln{font-size:14.5px;font-weight:600}
.ln-cjk{font-family:var(--cjk);font-size:13px;color:var(--graphite)}

.dir{margin-top:9px;padding:10px 12px;background:var(--wash);border-radius:3px}
.dir .eyebrow{display:block;margin-bottom:4px}
.dir b{font-family:var(--cjk);font-size:21px;font-weight:600;display:block;line-height:1.25}
.dir small{font-size:13px;color:var(--graphite);display:block;margin-top:4px;line-height:1.45}

/* ── табличка выхода ──────────────────────────── */
.plate{margin:12px 0 2px;background:var(--signal);border-radius:2px;padding:4px}
.plate-in{border:1.5px solid rgba(74,54,0,.34);border-radius:1px;padding:12px 14px;display:flex;align-items:center;gap:14px}
.plate-l{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1;color:var(--signal-ink);flex:none}
.plate-t .eyebrow{color:rgba(74,54,0,.62);display:block;margin-bottom:3px}
.plate-cjk{font-family:var(--cjk);font-size:18px;font-weight:600;color:var(--signal-ink);line-height:1.2}
.plate-n{font-size:12.5px;color:rgba(74,54,0,.78);margin-top:4px;line-height:1.4}
.plate.un{background:transparent;padding:0}
.plate.un .plate-in{border:1.5px dashed var(--mute)}
.plate.un .plate-l{color:var(--mute);font-size:28px}
.plate.un .plate-cjk{color:var(--ink);font-size:16px}
.plate.un .eyebrow{color:var(--mute)}
.plate.un .plate-n{color:var(--graphite)}

/* ── предупреждение ───────────────────────────── */
.warn{margin-top:12px;padding:12px 14px;border-left:2px solid var(--seal);background:var(--seal-wash);font-size:14px;line-height:1.5}
.warn b{font-weight:600}
.tip{margin-top:12px;padding:12px 14px;background:var(--wash);border-radius:3px;font-size:14px;line-height:1.5;color:#3A3F43}
.tip b{color:var(--ink);font-weight:600}

/* ── кнопки действий ──────────────────────────── */
.act{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;margin-top:9px;padding:14px 15px;
  border:1px solid var(--hairline);border-radius:3px;background:var(--card);
  font-size:14.5px;font-weight:550;text-align:left;line-height:1.3;
}
.act.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.act .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;opacity:.6;flex:none}
.act:active{transform:translateY(1px)}
.acts{margin-top:16px}

/* ── список дней ──────────────────────────────── */
.day-i{display:grid;grid-template-columns:46px 1fr;gap:14px;width:100%;padding:16px 0;border-top:1px solid var(--hairline);text-align:left;align-items:start}
.day-d{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1;padding-top:2px}
.day-d small{display:block;font-size:10px;letter-spacing:.1em;color:var(--mute);margin-top:4px;font-weight:400}
.day-t{font-size:16px;font-weight:550;letter-spacing:-.006em;line-height:1.32}
.day-c{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.day-i.now .day-d{color:var(--seal)}
.day-i.past{opacity:.45}

/* ── такси / фразы ────────────────────────────── */
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border-top:1px solid var(--hairline);text-align:left}
.tx-t{flex:1;min-width:0}
.tx-ru{font-size:15px;font-weight:550;line-height:1.3}
.tx-cn{font-family:var(--cjk);font-size:14px;color:var(--graphite);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-ch{font-family:var(--mono);font-size:13px;color:var(--mute);flex:none}
.ph-cn{font-family:var(--cjk);font-size:23px;font-weight:600;line-height:1.3;margin-top:3px}
.ph-tr{font-family:var(--mono);font-size:12.5px;color:var(--mute);margin-top:4px}
.ph.key .ph-cn{color:var(--seal)}

/* ── полноэкранный показ ──────────────────────── */
.fs{position:fixed;inset:0;background:var(--card);z-index:80;display:none;flex-direction:column;justify-content:center;padding:30px 24px}
.fs.on{display:flex}
.fs-close{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;border:1px solid var(--hairline);border-radius:3px;padding:10px 14px;color:var(--graphite)}
.fs .eyebrow{margin-bottom:18px}
.fs-cn{font-family:var(--cjk);font-size:40px;font-weight:600;line-height:1.28}
.fs-ad{font-family:var(--cjk);font-size:21px;line-height:1.5;margin-top:12px;color:#3A3F43}
.fs-tel{font-family:var(--mono);font-size:17px;margin-top:14px}
.fs-tel a{color:var(--seal);text-decoration:none}
.fs-say{margin-top:24px;padding-top:20px;border-top:2px solid var(--seal);font-family:var(--cjk);font-size:24px;font-weight:600;line-height:1.45}
.fs-ru{font-size:13.5px;color:var(--graphite);margin-top:11px}

/* ── нижняя навигация ─────────────────────────── */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(251,250,247,.94);backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--hairline);
  padding-bottom:var(--safe-b);
  display:flex;
}
.nav button{
  flex:1;min-width:0;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--mono);font-size:7.6px;letter-spacing:.03em;text-transform:uppercase;color:var(--mute);padding:0 1px;
}
.nav button.on{color:var(--ink)}
.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}


/* ═══ ЗАСТАВКА ПРИ ЗАПУСКЕ ═══════════════════════ */
.splash{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(170deg,#9FB0AA 0%,#C6B49A 46%,#8B7869 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;padding:32px;overflow:hidden;
  transition:opacity .42s ease,visibility .42s;
}
.splash.gone{opacity:0;visibility:hidden}
.splash-art{
  width:min(58vw,236px);aspect-ratio:1;border-radius:24%;
  box-shadow:0 18px 46px rgba(20,17,14,.42),0 3px 10px rgba(20,17,14,.28);
  background:#8FA39F center/cover no-repeat;
  animation:sp-in .72s cubic-bezier(.2,.9,.25,1) both, sp-float 2.6s ease-in-out .72s infinite;
  position:relative;z-index:2;
}
.splash-ttl{
  font-size:22px;font-weight:600;letter-spacing:-.015em;color:#FFF8EC;
  text-shadow:0 2px 10px rgba(20,17,14,.5);
  animation:sp-up .5s ease-out .28s both;position:relative;z-index:2;
}
.splash-sub{
  font-family:var(--mono);font-size:11px;letter-spacing:.19em;text-transform:uppercase;
  color:rgba(255,248,236,.72);margin-top:-16px;
  animation:sp-up .5s ease-out .42s both;position:relative;z-index:2;
}
/* пыль из-под лап */
.dust{position:absolute;bottom:0;left:0;right:0;height:52%;z-index:1;pointer-events:none}
.dust i{
  position:absolute;bottom:14%;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,rgba(255,250,238,.9),rgba(255,250,238,0) 70%);
  animation:sp-dust linear infinite;
}
@keyframes sp-in{
  from{opacity:0;transform:scale(.72) translateY(18px) rotate(-3deg)}
  to  {opacity:1;transform:scale(1) translateY(0) rotate(0)}
}
@keyframes sp-float{
  0%,100%{transform:translateY(0) rotate(0)}
  50%    {transform:translateY(-9px) rotate(.8deg)}
}
@keyframes sp-up{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes sp-dust{
  0%  {transform:translateX(0) scale(.5);opacity:0}
  18% {opacity:.85}
  100%{transform:translateX(-88vw) scale(1.7);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .splash-art,.splash-ttl,.splash-sub{animation:none!important}
  .dust{display:none}
}

/* ── тост ─────────────────────────────────────── */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav) + var(--safe-b) + 16px);z-index:90;
  max-width:calc(100% - 36px);padding:13px 17px;border-radius:3px;
  background:var(--ink);color:var(--paper);font-size:13.5px;line-height:1.45;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.toast.on{opacity:1}

.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--hairline);font-size:12.5px;color:var(--mute);line-height:1.6}

/* ── трекер расходов ──────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:20px;border:1px solid var(--hairline);background:var(--card);font-family:inherit;font-size:13px;font-weight:550;color:var(--graphite)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;border:1px solid var(--hairline);border-radius:3px;overflow:hidden}
.seg button{flex:1;padding:11px;font-family:inherit;font-size:14px;font-weight:600;background:var(--card);color:var(--graphite)}
.seg button.on{background:var(--signal);color:var(--signal-ink)}
.m-input{width:100%;padding:13px 14px;border:1px solid var(--hairline);border-radius:3px;background:var(--card);font-family:inherit;font-size:15px;color:var(--ink);-webkit-appearance:none}
.m-input::placeholder{color:var(--mute)}
.money-big{font-family:var(--mono);font-size:34px;font-weight:600;margin-top:8px;letter-spacing:-.01em}
.bar{height:5px;background:var(--wash);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--seal)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="splash" id="splash" onclick="hideSplash()">
  <div class="dust" id="dust"></div>
  <div class="splash-art" id="splash-art"></div>
  <div class="splash-ttl">China Travel OS</div>
  <div class="splash-sub" id="splash-sub">18–30 сентября</div>
</div>

<div id="app" class="wrap"></div>

<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>

<div class="fs" id="fs">
  <button class="fs-close" onclick="closeFs()">ЗАКРЫТЬ</button>
  <span class="eyebrow" id="fs-k"></span>
  <div class="fs-cn" id="fs-cn"></div>
  <div class="fs-ad" id="fs-ad"></div>
  <div class="fs-tel" id="fs-tel"></div>
  <div class="fs-say" id="fs-say"></div>
  <div class="fs-ru" id="fs-ru"></div>
</div>

<input type="file" id="docpick" accept="image/*,application/pdf" multiple hidden>

<div class="fs" id="dv" style="background:#0E1012;padding:0;justify-content:flex-start">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;flex:none">
    <span class="eyebrow" id="dv-t" style="color:#7C8287"></span>
    <button class="fs-close" style="position:static;border-color:rgba(255,255,255,.22);color:#E8E6E0" onclick="closeDv()">ЗАКРЫТЬ</button>
  </div>
  <div id="dv-body" style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:0 10px 20px"></div>
</div>

<!-- ВАЖНО: число ?v=24 в двух строках ниже — тоже кэш-бастинг,
     но статический (в отличие от worker.js, его нельзя вычислить
     через JS, HTML читается раньше). Меняйте его на актуальный
     номер сборки при КАЖДОЙ правке data.js или app.js, иначе
     браузер будет читать эти файлы из кэша тоже. -->
<script src="data.js?v=24"></script>
<script src="app.js?v=24"></script>

<script type="module">
  /* Синхронизация трат между телефонами через Firebase Realtime Database.
     Если нет сети/VPN или что-то не так с настройками — просто
     не выполнится, и трекер продолжит работать локально, как раньше. */
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js';
  import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAQAZ9jhZmqW6fLdF3oPhJoJoW2UMSidUQ",
    authDomain: "china-os-41bc9.firebaseapp.com",
    databaseURL: "https://china-os-41bc9-default-rtdb.firebaseio.com",
    projectId: "china-os-41bc9",
    storageBucket: "china-os-41bc9.firebasestorage.app",
    messagingSenderId: "933248297992",
    appId: "1:933248297992:web:67f85c5e944f5d572f75bd"
  };

  try{
    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);
    if(typeof window.initFirebaseSync === 'function'){
      window.initFirebaseSync(ref, set, onValue, db);
    }
  }catch(e){ /* оффлайн или VPN выключен — работаем локально */ }
</script>
</body>
</html>
